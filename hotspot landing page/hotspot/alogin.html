<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="2; url=$(link-redirect)">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Berhasil Terhubung...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      color: #18181b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 22px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
    }
    .check-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ecfdf5;
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    p { font-size: 13px; color: #71717a; line-height: 1.5; }
    a { color: #18181b; font-weight: 600; }
  </style>
  <script>
    function startClock() {
      $(if popup == 'true')
      open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=380,height=460');
      $(endif)
      location.href = unescape('$(link-redirect-esc)');
    }
  </script>
</head>
<body onLoad="startClock()">
  <div class="card">
    <div class="check-circle">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Berhasil Terhubung</h1>
    <p>Mengalihkan halaman otomatis... Jika tidak berpindah, <a href="$(link-redirect)">klik di sini</a>.</p>
  </div>
</body>
</html>
