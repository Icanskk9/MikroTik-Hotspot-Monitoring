<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Terjadi Kesalahan - WiFi Hotspot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      color: #18181b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 22px;
      padding: 34px 28px;
      text-align: center;
      box-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
    }
    .err-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #fef2f2;
      color: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .err-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      height: 44px;
      line-height: 44px;
      background: #242424;
      color: #ffffff;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="err-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h1>Akses Ditolak</h1>
    <div class="err-msg">$(error)</div>
    <a href="$(link-login)" class="btn">Kembali ke Halaman Login</a>
  </div>
</body>
</html>
